services:
  postgres:
    image: postgres:16-alpine
    container_name: food-mapper-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: food_mapper
    ports:
      - '5432:5432'
    volumes:
      - food-mapper-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d food_mapper']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  food-mapper-pgdata:
